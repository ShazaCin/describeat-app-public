<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline - DescribeAT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { font-size: 1rem; color: #94a3b8; max-width: 320px; line-height: 1.5; }
    .retry-btn {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #334155; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="20" fill="#1e293b"/>
    <text x="50" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff" font-family="sans-serif">dA</text>
  </svg>
  <h1>You're offline</h1>
  <p>Check your connection and try again</p>
  <button class="retry-btn" onclick="location.reload()">Try Again</button>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
